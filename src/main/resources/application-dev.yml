server:
  port: ${SERVER_PORT:8989}

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:xxxxxx}:${MYSQL_PORT:3306}/${xxxxx:keelp_blog}?zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&autoReconnect=true&allowMultiQueries=true
    username: ${MYSQL_USERNAME:xxxx}
    password: ${MYSQL_PASSWORD:xxxx}
  data:
    redis:
      database: ${REDIS_DATABASE:0}
      host: ${REDIS_HOST:xxxxx}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:xxxx} # 留空表示可能无密码，生产请设置环境变量
      timeout: ${REDIS_TIMEOUT:10s}
      lettuce:
        pool:
          # 连接池最大连接数 默认8 ，负数表示没有限制
          max-active: ${REDIS_POOL_MAX_ACTIVE:8}
          # 连接池最大阻塞等待时间（使用负值表示没有限制） 默认-1
          max-wait: ${REDIS_POOL_MAX_WAIT:-1}
          # 连接池中的最大空闲连接 默认8
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          # 连接池中的最小空闲连接 默认0
          min-idle: ${REDIS_POOL_MIN_IDLE:0}
  cache:
    enabled: ${CACHE_ENABLED:false}
    type: ${CACHE_TYPE:redis}
    redis:
      time-to-live: ${CACHE_REDIS_TTL:3600000}
      cache-null-values: ${CACHE_REDIS_CACHE_NULL_VALUES:true}
    caffeine:
      spec: ${CAFFEINE_SPEC:initialCapacity=50,maximumSize=1000,expireAfterWrite=600s}
  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:no-reply@example.com}
    password: ${MAIL_PASSWORD:changeme}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    from: ${MAIL_FROM:no-reply@example.com}

app:
  portal-auth:
    oauth-success-redirect-url: http://localhost:5173/auth/callback
    oauth-failure-redirect-url: http://localhost:5173/auth/callback
    qq:
      enabled: false
      app-id:
      app-secret:
      redirect-url:
    gitee:
      enabled: false
      app-id:
      app-secret:
      redirect-url:
    github:
      enabled: false
      app-id:
      app-secret:
      redirect-url:
    email:
      site-name: 橙子的小屋
      site-url: 无 #https://gitee.com/variable-wing-core/klee-blog
      expire-minutes: 5
      subject: 橙子的小屋登录验证码
      html-template: |
        <div style="margin:0;padding:28px 0;background:#eef2ff;background-image:linear-gradient(180deg,#eef2ff 0%,#f8fafc 100%);font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;color:#172033;line-height:1.75;">
          <div style="max-width:640px;margin:0 auto;padding:0 18px;">
            <div style="padding:18px 6px 20px;text-align:center;">
              <div style="display:inline-block;padding:7px 14px;border-radius:999px;background:rgba(37,99,235,0.10);color:#1d4ed8;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;">${siteName}</div>
            </div>
            <div style="overflow:hidden;border:1px solid rgba(148,163,184,0.20);border-radius:28px;background:#ffffff;box-shadow:0 24px 60px rgba(15,23,42,0.12);">
              <div style="padding:40px 40px 24px;background:radial-gradient(circle at top left,#dbeafe 0%,#ffffff 52%);border-bottom:1px solid rgba(226,232,240,0.85);">
                <div style="margin-bottom:14px;font-size:13px;font-weight:700;letter-spacing:1.4px;color:#2563eb;text-transform:uppercase;">Login Verification</div>
                <h1 style="margin:0;font-size:30px;line-height:1.25;color:#0f172a;">你的验证码已送达</h1>
                <p style="margin:16px 0 0;font-size:15px;color:#475569;">${email}，你好。你正在使用 <span style="font-weight:700;color:#0f172a;">${siteName}</span> 进行登录验证，请在 <span style="font-weight:700;color:#0f172a;">${expireMinutes} 分钟</span> 内完成操作。</p>
              </div>
              <div style="padding:30px 40px 12px;">
                <div style="margin:0 0 24px;padding:24px 20px;border-radius:24px;background:linear-gradient(135deg,#1d4ed8 0%,#0f172a 100%);text-align:center;box-shadow:inset 0 1px 0 rgba(255,255,255,0.14);">
                  <div style="margin-bottom:10px;font-size:12px;letter-spacing:2px;color:rgba(255,255,255,0.68);text-transform:uppercase;">Verification Code</div>
                  <div style="font-size:36px;font-weight:800;letter-spacing:10px;color:#ffffff;line-height:1.2;">${code}</div>
                </div>
                <div style="padding:18px 20px;border-radius:18px;background:#f8fafc;border:1px solid #e2e8f0;color:#475569;font-size:14px;">
                  为了保障账号安全，请不要将验证码透露给任何人。工作人员不会以任何形式向你索要验证码。
                </div>
                <div style="padding:28px 0 10px;color:#64748b;font-size:14px;">
                  <p style="margin:0 0 10px;">如果这不是你的操作，可以直接忽略这封邮件，账号不会受到影响。</p>
                  <p style="margin:0;">站点地址：<a href="${siteUrl}" style="color:#1d4ed8;text-decoration:none;font-weight:600;">${siteUrl}</a></p>
                </div>
              </div>
              <div style="padding:18px 40px 28px;border-top:1px solid rgba(226,232,240,0.85);background:#f8fafc;color:#94a3b8;font-size:12px;text-align:center;">
                此邮件由系统自动发送，请勿直接回复。
              </div>
            </div>
          </div>
        </div>

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: none
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.stdout.StdOutImpl}

sa-token:
  timeout: ${SA_TOKEN_TIMEOUT:2592000}
  active-timeout: ${SA_TOKEN_ACTIVE_TIMEOUT:-1}
  is-concurrent: ${SA_TOKEN_IS_CONCURRENT:true}
  is-share: ${SA_TOKEN_IS_SHARE:false}
  token-style: ${SA_TOKEN_STYLE:uuid}
  is-log: ${SA_TOKEN_IS_LOG:true}

security:
  unsecured-urls:
    - ${springdoc.swagger-ui.path}
    - /doc.html
    - /swagger-ui/**
    - /v3/api-docs/**
    - /webjars/**
    - /favicon.ico

oss:
  type: ${OSS_TYPE:jingdongyun}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY:changeMe}
    secret-key: ${MINIO_SECRET_KEY:changeMe}
    bucket-name: ${MINIO_BUCKET_NAME:klee}
    custom-domain: ${MINIO_CUSTOM_DOMAIN:}
  aliyun:
    endpoint: ${ALIYUN_OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
    access-key-id: ${ALIYUN_ACCESS_KEY_ID:xxx}
    access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:xxx}
    bucket-name: ${ALIYUN_BUCKET_NAME:default}
  local:
    storage-path: ${LOCAL_STORAGE_PATH:/data/storage/}
  qiniuyun:
    access-key: ${QINIU_ACCESS_KEY:你的AK}
    secret-key: ${QINIU_SECRET_KEY:你的SK}
    bucket-name: ${QINIU_BUCKET_NAME:你的空间名}
    domain: ${QINIU_DOMAIN:测试域名或自定义域名}
    region: ${QINIU_REGION:z0} # 存储区域，如 z0(华东), z1(华北) 等
  jingdongyun:
    # ⚠ 忽略原注释！因为你的轻量服务器被隔离，这里必须填【外网】 Endpoint，否则后端上传会超时报错
    endpoint: xxxxx
    domain: xxxxxx
    region: xxxxx
    bucket-name: xxxxx
    access-key: xxxx
    secret-key: xxxx
sms:
  aliyun:
    accessKeyId: ${ALIYUN_SMS_ACCESS_KEY_ID:xxx}
    accessKeySecret: ${ALIYUN_SMS_ACCESS_KEY_SECRET:xxx}
    domain: ${ALIYUN_SMS_DOMAIN:dysmsapi.aliyuncs.com}
    regionId: ${ALIYUN_SMS_REGION_ID:cn-shanghai}
    signName: ${ALIYUN_SMS_SIGN_NAME:YourSign}
    templates:
      register: ${ALIYUN_SMS_TEMPLATE_REGISTER:SMS_xxx_register}
      login: ${ALIYUN_SMS_TEMPLATE_LOGIN:SMS_xxx_login}
      change-mobile: ${ALIYUN_SMS_TEMPLATE_CHANGE_MOBILE:SMS_xxx_change_mobile}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: '系统管理'
      paths-to-match: "/**"
      packages-to-scan:
        - com.klee.auth.controller
        - com.klee.system.controller
        - com.klee.shared.file.controller
        - com.klee.shared.codegen.controller
  default-flat-param-object: true

knife4j:
  enable: ${KNIFE4J_ENABLE:true}
  production: ${KNIFE4J_PRODUCTION:false}
  setting:
    language: zh_cn

xxl:
  job:
    enabled: false #${XXL_JOB_ENABLED:false}
    admin:
      addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://127.0.0.1:8080/xxl-job-admin}
    accessToken: ${XXL_JOB_ACCESS_TOKEN:default_token}
    executor:
      appname: xxl-job-executor-${spring.application.name}
      address: ${XXL_JOB_EXECUTOR_ADDRESS:}
      ip: ${XXL_JOB_EXECUTOR_IP:}
      port: ${XXL_JOB_EXECUTOR_PORT:9999}
      logpath: ${XXL_JOB_EXECUTOR_LOGPATH:/data/applogs/xxl-job/jobhandler}
      logretentiondays: ${XXL_JOB_EXECUTOR_LOG_RETENTION_DAYS:30}

captcha:
  type: ${CAPTCHA_TYPE:circle}
  width: ${CAPTCHA_WIDTH:120}
  height: ${CAPTCHA_HEIGHT:40}
  interfere-count: ${CAPTCHA_INTERFERE_COUNT:2}
  text-alpha: ${CAPTCHA_TEXT_ALPHA:0.8}
  code:
    type: ${CAPTCHA_CODE_TYPE:math}
    length: ${CAPTCHA_CODE_LENGTH:1}
  font:
    name: ${CAPTCHA_FONT_NAME:SansSerif}
    weight: ${CAPTCHA_FONT_WEIGHT:1}
    size: ${CAPTCHA_FONT_SIZE:24}
  expire-seconds: ${CAPTCHA_EXPIRE_SECONDS:120}

wx:
  miniapp:
    app-id: ${WX_MINIAPP_APP_ID:xxxxx}
    app-secret: ${WX_MINIAPP_APP_SECRET:xxxxx}
