# Docker Compose for wing-blog development environment based on application-dev.yml

networks:
  wing:
    driver: bridge

services:
  mysql:
    image: mysql:8.0.29
    container_name: mysql
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - LANG=en_US.UTF-8
      - MYSQL_ROOT_PASSWORD=yourpassword            # Root password (matches application-dev)
      - MYSQL_DATABASE=blog                         # Create blog database automatically
    volumes:
      - ./mysql/conf/my.cnf:/etc/my.cnf             # Custom MySQL configuration
      - ./mysql/data:/var/lib/mysql                 # Persist MySQL data
      - ../sql/mysql:/docker-entrypoint-initdb.d    # Init SQL scripts (blog.sql, etc.)
    ports:
      - 3306:3306
    networks:
      - wing
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7.2.3
    container_name: redis
    restart: unless-stopped
    command: redis-server /etc/redis/redis.conf --requirepass yourpassword --appendonly no
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./redis/data:/data
      - ./redis/config/redis.conf:/etc/redis/redis.conf
    ports:
      - 6379:6379
    networks:
      - wing
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      - TZ=Asia/Shanghai
      - LANG=en_US.UTF-8
      - MINIO_ROOT_USER=yourrootuser
      - MINIO_ROOT_PASSWORD=yourrootpassword
    volumes:
      - ./minio/data:/data
      - ./minio/config:/root/.minio
    networks:
      - wing
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 5

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.0
    container_name: xxl-job-admin
    restart: unless-stopped
    environment:
      PARAMS: '--spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai --spring.datasource.username=root --spring.datasource.password=rootpassword --spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver'
    volumes:
      - ./xxljob/logs:/data/applogs
    ports:
      - 8080:8080
    networks:
      - wing
    depends_on:
      - mysql

  wing-blog:
    # Build the application image from the project root Dockerfile (expects wing-blog.jar in target)
    build:
      context: ..
      dockerfile: Dockerfile
    image: wing-blog:dev
    container_name: wing-blog
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - SPRING_PROFILES_ACTIVE=dev
      # Override datasource properties (using internal service name instead of external IP)
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/blog?zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&autoReconnect=true&allowMultiQueries=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=yourpassword
      # Redis override
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=yourpassword
      # MinIO override
      - OSS_MINIO_ENDPOINT=http://minio:9000
      - OSS_MINIO_ACCESS_KEY=yourrootuser
      - OSS_MINIO_SECRET_KEY=yourrootpassword
      - OSS_MINIO_BUCKET_NAME=klee
      # JVM options (adjust as needed)
      - JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - 8989:8989  # Application port (server.port)
      - 18080:18080 # Optional debug/management port if used
    networks:
      - wing
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 6

# Usage:
# 1. Ensure you have built the jar: mvn clean package -DskipTests
# 2. From this docker directory run: docker compose up -d --build
# 3. wing-blog will start after MySQL & Redis are healthy.
# 4. Logs: docker compose logs -f wing-blog
